[tox]
envlist = linters,pep8,pylint
minversion = 2.3
skipsdist = True

[testenv]
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt} \
    {opts} {packages}
setenv = VIRTUAL_ENV={envdir}
         OS_STDOUT_CAPTURE=1
         OS_STDERR_CAPTURE=1
         OS_TEST_TIMEOUT=60
deps = -r{toxinidir}/test-requirements.txt
allowlist_externals = reno

[trixie]
basepython = python3
setenv = {[testenv]setenv}
         UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE} \
    {opts} {packages}

[testenv:linters]
basepython = python3
allowlist_externals = bash
#bashate ignore errors
#E010: do not on the same line as for
#E006 Line too long
commands =
  bash -c "find {toxinidir}          \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         \(                                   \
          -name \*.sh                         \
          -or -not -wholename \*/devstack/files/\* \
          -wholename \*/devstack/\*           \
         \)                                   \
         -print0 | xargs -r -n 1 -0 bashate -v -i E010,E006"
  bash -c "find {toxinidir}                     \
        -name .tox -prune                       \
        -o -type f -name '*.yaml'               \
        -print0 | xargs -0 yamllint -f parsable"

[testenv:pylint]
basepython = python3
usedevelop = False
# sitepackages needed - mtce imports require system libs
sitepackages = True
description =
    Pylint check
deps = {[testenv]deps}
       redfish
       pylint
commands =
     pylint {posargs} --rcfile=./pylint.rc \
         tools/rvmc/docker/rvmc.py \
         mtce/src/hwmon/scripts/hwmond_notify.py

[testenv:pep8]
basepython = python3
usedevelop = False
deps =
    flake8
description =
    Run style checks
commands =
    flake8
# hacking can be added for additional pep8 once this passes for all metal

[flake8]
show-source = True
exclude = .venv,.git,.tox,dist,doc,*lib/python*,*egg,build,release-tag-*
# H102 Apache 2.0 license header not found
# H306 imports not in alphabetical order
# H403 multi line docstrings should end on a new line
# H404 multi line docstring should start without a leading new line
# H405 multi line docstring summary not separated with an empty line
# W504 line break after binary operator
ignore = H102,H306,H403,H404,H405,W504
per-file-ignores =
    tests/*:E128,E303,F401,F841,W503

[testenv:venv]
commands = {posargs}

[testenv:docs]
basepython = python3
deps = -r{toxinidir}/doc/requirements.txt
commands =
    rm -rf doc/build
    sphinx-build -a -E -W -d doc/build/doctrees -b html doc/source doc/build/html
allowlist_externals = rm

[testenv:releasenotes]
basepython = python3
deps = -r{toxinidir}/doc/requirements.txt
commands =
    rm -rf releasenotes/build
    sphinx-build -a -E -W -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html
allowlist_externals = rm

[testenv:newnote]
basepython = python3
# Re-use the releasenotes venv
envdir = {toxworkdir}/releasenotes
deps = -r{toxinidir}/doc/requirements.txt
commands = reno new {posargs}

[testenv:api-ref]
basepython = python3
deps =
    -r{toxinidir}/doc/requirements.txt
commands =
  rm -rf api-ref/build
  sphinx-build -W -b html -d api-ref/build/doctrees api-ref/source api-ref/build/html
allowlist_externals = rm

[testenv:functional]
basepython = python3
allowlist_externals = cat
commands = cat /etc/mtc.ini

[testenv:bandit]
basepython = python3
description = Bandit code scan for *.py files
deps = -r{toxinidir}/test-requirements.txt
# --skip B602,B605: subprocess shell=True and os.system() are intentional
# in rvmc.py/rsbc.py for BMC hardware management (system commands required)
commands = bandit -r {toxinidir}/ -x '**/.tox/**,**/.eggs/**,**/tests/**' --skip B602,B605 --severity-level medium

[testenv:coverage]
basepython = python3
usedevelop = False
# sitepackages needed - mtce imports require system libs
sitepackages = True
description = Run all tests with coverage analysis (85% target)
deps = -r{toxinidir}/test-requirements.txt
       pytest
       pytest-cov
       PyYAML
setenv = {[testenv]setenv}
install_command = {[testenv]install_command}
changedir = {toxinidir}
allowlist_externals = bash
                      mkdir
                      pytest
commands =
    mkdir -p UTCoverage
    pytest tests/ \
        --cov=tools/rvmc/docker \
        --cov=tools/rsbc \
        --cov=mtce/src/hwmon/scripts \
        --cov=api-ref/source \
        --cov=doc/source \
        --cov=releasenotes/source \
        --cov-report=term-missing \
        --cov-report=html:UTCoverage/htmlcov \
        --cov-config=.coveragerc \
        -v --tb=short \
        {posargs}
    bash -c "cp UTCoverage/htmlcov/index.html UTCoverage/ 2>/dev/null || true"

[testenv:coverage-c]
basepython = python3
usedevelop = False
description = Run C/C++ coverage analysis via gcov/lcov
deps =
allowlist_externals = bash
                      mkdir
                      gcc
                      g++
                      gcov
                      lcov
                      genhtml
commands =
    mkdir -p {toxinidir}/UTCoverage
    bash {toxinidir}/tests/scripts/run_c_coverage.sh {toxinidir}

[testenv:pylint-trixie]
basepython = {[trixie]basepython}
usedevelop = False
# sitepackages needed - mtce imports require system libs
sitepackages = True
description = Pylint check (Trixie)
deps = {[testenv]deps}
       redfish
       pylint
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
commands =
     pylint {posargs} --rcfile=./pylint.rc \
         tools/rvmc/docker/rvmc.py \
         mtce/src/hwmon/scripts/hwmond_notify.py

[testenv:coverage-trixie]
basepython = {[trixie]basepython}
usedevelop = False
# sitepackages needed - mtce imports require system libs
sitepackages = True
description = Run all tests with coverage analysis (Trixie)
deps = {[testenv:coverage]deps}
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
changedir = {toxinidir}
allowlist_externals = {[testenv:coverage]allowlist_externals}
commands = {[testenv:coverage]commands}

[testenv:coverage-c-trixie]
basepython = {[trixie]basepython}
usedevelop = False
description = Run C/C++ coverage analysis via gcov/lcov
deps = 
allowlist_externals = {[testenv:coverage-c]allowlist_externals}
commands = {[testenv:coverage-c]commands}

[testenv:bandit-trixie]
basepython = {[trixie]basepython}
usedevelop = False
description = Run security analysis with bandit (Trixie)
deps = {[testenv]deps}
       bandit
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = bash
                      mkdir
commands =
    mkdir -p {toxinidir}/UTCoverage
    # --skip B602,B605: subprocess shell=True and os.system() are intentional
    # in rvmc.py/rsbc.py for BMC hardware management (system commands required)
    bash -c "bandit -r {toxinidir}/tools/ {toxinidir}/mtce/src/hwmon/scripts/ \
        -x '**/.tox/**,**/.eggs/**,**/tests/**' \
        --skip B602,B605 \
        -f txt -o {toxinidir}/UTCoverage/security_report.txt \
        --severity-level medium"
    bash -c "bandit -r {toxinidir}/tools/ {toxinidir}/mtce/src/hwmon/scripts/ \
        -x '**/.tox/**,**/.eggs/**,**/tests/**' \
        --skip B602,B605 \
        -f json -o {toxinidir}/UTCoverage/bandit-report.json \
        --severity-level medium"